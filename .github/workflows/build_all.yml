name: Build Multi-Platform Artifacts (Android, Linux, Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Android Build
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calories-calculator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================================================
  # 2. Linux Desktop Build
  # ============================================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libopencv-dev libdeflate-dev libimath-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Linux ONNX Runtime for pp_ocr
        run: |
          cd $(find ~/.pub-cache/hosted/pub.dev/pp_ocr-* -maxdepth 0)
          bash tool/setup_linux_deps.sh || true

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release
          tar -czf calories-calculator-linux-x64.tar.gz bundle

      - name: Upload Linux Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: calories-calculator-linux-x64
          path: build/linux/x64/release/calories-calculator-linux-x64.tar.gz

  # ============================================================================
  # 3. Windows Desktop Build
  # ============================================================================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Setup OpenCV 4.9.0 for Windows
        shell: pwsh
        run: |
          Write-Host "Downloading OpenCV 4.9.0 Windows release..."
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-windows.exe" -OutFile "$env:TEMP\opencv.exe"
          Write-Host "Extracting OpenCV..."
          Start-Process -FilePath "$env:TEMP\opencv.exe" -ArgumentList "-o$env:RUNNER_TEMP -y" -Wait

          # Locate the actual OpenCVConfig.cmake inside the extraction (vc16)
          $cvConfig = Get-ChildItem -Path "$env:RUNNER_TEMP\opencv" -Filter "OpenCVConfig.cmake" -Recurse | Where-Object { $_.FullName -like "*vc16\lib*" } | Select-Object -First 1
          if ($cvConfig) {
            $cvDir = $cvConfig.DirectoryName
            Write-Host "Found inner OpenCVConfig.cmake in: $cvDir"
            # Overwrite root OpenCVConfig.cmake so that root dispatcher doesn't block on newer MSVC versions
            Copy-Item -Path $cvConfig.FullName -Destination "$env:RUNNER_TEMP\opencv\build\OpenCVConfig.cmake" -Force
            echo "OpenCV_DIR=$cvDir" >> $env:GITHUB_ENV
          } else {
            echo "OpenCV_DIR=$env:RUNNER_TEMP\opencv\build\x64\vc16\lib" >> $env:GITHUB_ENV
          }

          echo "$env:RUNNER_TEMP\opencv\build\x64\vc16\bin" >> $env:GITHUB_PATH

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject OpenCV into pp_ocr plugin
        shell: pwsh
        run: |
          $ppOcrPlugin = Get-ChildItem -Path "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Filter "pp_ocr-*" -Directory | Select-Object -First 1
          if ($ppOcrPlugin) {
            $pluginThirdParty = "$($ppOcrPlugin.FullName)\windows\third_party\opencv\lib"
            New-Item -ItemType Directory -Path $pluginThirdParty -Force | Out-Null
            Copy-Item "$env:RUNNER_TEMP\opencv\build\x64\vc16\bin\opencv_world490.dll" -Destination "$pluginThirdParty\" -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:RUNNER_TEMP\opencv\build\x64\vc16\lib\opencv_world490.lib" -Destination "$pluginThirdParty\" -Force -ErrorAction SilentlyContinue
            Write-Host "Injected OpenCV into $($pluginThirdParty)"
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\opencv\build\x64\vc16\bin\opencv_world490.dll" -Destination "build\windows\x64\runner\Release\" -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\calories-calculator-windows-x64.zip

      - name: Upload Windows Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: calories-calculator-windows-x64
          path: build\calories-calculator-windows-x64.zip

  # ============================================================================
  # 4. GitHub Release (Runs on Tag Push)
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: calories-calculator-android-apk
          path: release-artifacts/android

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: calories-calculator-linux-x64
          path: release-artifacts/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: calories-calculator-windows-x64
          path: release-artifacts/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/android/app-release.apk
            release-artifacts/linux/calories-calculator-linux-x64.tar.gz
            release-artifacts/windows/calories-calculator-windows-x64.zip
          generate_release_notes: true
